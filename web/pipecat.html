<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mia · Pipecat Console</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #181b24;
        --border: #262b38;
        --text: #e6e8ee;
        --muted: #9aa1b2;
        --accent: #a855f7;
        --idle: #6b7280;
        --listening: #34d399;
        --speaking: #60a5fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 50% -100px, #221631 0%, var(--bg) 60%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
      .subtitle code { color: var(--accent); }

      .indicator-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
      .indicator {
        width: 64px; height: 64px; border-radius: 50%;
        background: var(--idle);
        position: relative; flex: 0 0 auto;
        transition: background 0.25s ease, box-shadow 0.25s ease;
        box-shadow: 0 0 22px 3px rgba(107, 114, 128, 0.4);
      }
      .indicator[data-state="listening"] { background: var(--listening); box-shadow: 0 0 22px 3px rgba(52, 211, 153, 0.4); }
      .indicator[data-state="speaking"] { background: var(--speaking); box-shadow: 0 0 22px 3px rgba(96, 165, 250, 0.45); }
      .indicator[data-state="connecting"],
      .indicator[data-state="waiting"] { background: var(--accent); box-shadow: 0 0 22px 3px rgba(168, 85, 247, 0.4); }
      .indicator[data-state="listening"]::after,
      .indicator[data-state="speaking"]::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        border: 2px solid currentColor; opacity: 0;
        animation: pulse 1.4s ease-out infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.55; }
        70% { transform: scale(1.9); opacity: 0; }
        100% { transform: scale(1.9); opacity: 0; }
      }
      .status { font-size: 15px; font-weight: 600; }
      .subagent { color: var(--muted); font-size: 12px; min-height: 16px; }

      .row { display: flex; gap: 10px; margin-bottom: 12px; }
      input[type="text"] {
        flex: 1; padding: 12px 14px; border-radius: 10px;
        border: 1px solid var(--border); background: #12141c;
        color: var(--text); font-size: 14px;
      }
      button {
        padding: 12px 14px; border-radius: 10px;
        border: 1px solid var(--border); background: #232838;
        color: var(--text); font-size: 14px; font-weight: 600;
        cursor: pointer; transition: background 0.15s;
      }
      button:hover:not(:disabled) { background: #2c3347; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #connectBtn { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 130px; }
      #connectBtn:hover:not(:disabled) { background: #b56bf5; }
      #talkBtn { flex: 1; }
      #talkBtn[data-on="true"] { background: var(--listening); border-color: var(--listening); color: #06281c; }

      .transcript {
        border: 1px solid var(--border); border-radius: 12px; background: #12141c;
        height: 200px; overflow-y: auto; padding: 14px;
        display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;
      }
      .msg { border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.45; max-width: 88%; }
      .msg.user { align-self: flex-end; background: #2b3350; }
      .msg.agent { align-self: flex-start; background: #33263f; }
      .msg .who { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 2px; }
      .transcript:empty::before { content: "Live transcript appears here as you talk — yours while you speak, Mia's when she answers."; color: var(--muted); font-size: 13px; }

      .eventlog {
        border: 1px solid var(--border); border-radius: 12px; background: #0c0e14;
        height: 120px; overflow-y: auto; padding: 10px 12px;
        font-family: Consolas, monospace; font-size: 12px; color: var(--muted);
      }
      .eventlog .t { color: #5b6272; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Mia · Pipecat Console</h1>
      <p class="subtitle">
        Browser WebRTC → LiveKit room → <code>pipecat-bot/bot.py</code> (Sarvam + Groq).
        No gateway, no worker dispatch — just two clients in a room.
      </p>

      <div class="indicator-wrap">
        <div id="indicator" class="indicator" data-state="idle"></div>
        <div>
          <div id="status" class="status">Idle</div>
          <div id="agentName" class="subagent"></div>
        </div>
      </div>

      <div class="row">
        <input id="roomInput" type="text" value="lobby" spellcheck="false" />
        <button id="connectBtn" type="button">Connect</button>
      </div>
      <div class="row">
        <button id="talkBtn" type="button" disabled data-on="false">Talk (mic off)</button>
      </div>

      <div id="transcript" class="transcript"></div>
      <div id="eventlog" class="eventlog"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
    <script>
      const { Room, RoomEvent } = window.LivekitClient;

      // The bot mints its token as identity "Pipecat Agent" (see
      // pipecat.runner.livekit.configure). That identity — not any
      // lk.agent.state attribute, which only LiveKit *workers* set — is how
      // this console knows Mia is in the room.
      const BOT_IDENTITY = "Pipecat Agent";

      const $id = (s) => document.getElementById(s);
      const els = {
        room: $id("roomInput"),
        connect: $id("connectBtn"),
        talk: $id("talkBtn"),
        indicator: $id("indicator"),
        status: $id("status"),
        agentName: $id("agentName"),
        transcript: $id("transcript"),
        eventlog: $id("eventlog"),
      };

      const room = new Room({ adaptiveStream: true, dynacast: true });
      let connected = false;

      const STATE_TEXT = {
        idle: "Idle",
        connecting: "Connecting...",
        waiting: "Connected — waiting for the Pipecat bot…",
        listening: "Listening — your turn",
        speaking: "Mia speaking…",
        failed: "Failed",
      };

      function setState(state, sub) {
        els.indicator.dataset.state = state;
        els.status.textContent = STATE_TEXT[state] || state;
        if (sub !== undefined) els.agentName.textContent = sub;
      }

      function logEvent(msg) {
        const t = new Date().toLocaleTimeString("en-GB");
        const div = document.createElement("div");
        const span = document.createElement("span");
        span.className = "t";
        span.textContent = `[${t}] `;
        div.appendChild(span);
        div.appendChild(document.createTextNode(msg));
        els.eventlog.appendChild(div);
        els.eventlog.scrollTop = els.eventlog.scrollHeight;
      }

      function botInRoom() {
        return [...room.remoteParticipants.values()].some(
          (p) => p.identity === BOT_IDENTITY,
        );
      }

      function refreshPresence() {
        if (!connected) return;
        if (!botInRoom()) {
          setState("waiting", "Start pipecat-bot/bot.py in the same room");
          return;
        }
        const remoteSpeaking = room.activeSpeakers.some(
          (p) => !p.isLocal && p.identity === BOT_IDENTITY,
        );
        if (remoteSpeaking) setState("speaking", "Mia (Pipecat) is in the room");
        else setState("listening", "Mia (Pipecat) is in the room");
      }

      function addRow(speaker, text) {
        const div = document.createElement("div");
        div.className = `msg ${speaker}`;
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = speaker === "agent" ? "Mia" : "You";
        div.appendChild(who);
        const span = document.createElement("span");
        span.className = "text";
        span.textContent = text;
        div.appendChild(span);
        els.transcript.appendChild(div);
        els.transcript.scrollTop = els.transcript.scrollHeight;
        return div;
      }

      let currentRow = null;
      let currentSpeaker = null;

      // Single renderer for both transcript sources below: interim text
      // updates the open bubble, final text seals it and opens fresh.
      function renderTranscript(speaker, text, isFinal) {
        if (!text) return;
        if (currentSpeaker !== speaker) {
          currentRow = addRow(speaker, text);
          currentSpeaker = speaker;
        } else if (currentRow) {
          currentRow.querySelector(".text").textContent = text;
        }
        if (isFinal) {
          currentRow = null;
          currentSpeaker = null;
        }
      }
      room
        .on(RoomEvent.ParticipantConnected, (p) => {
          logEvent(`participant joined: ${p.identity}`);
          if (p.identity === BOT_IDENTITY) logEvent("Mia (Pipecat) joined — say hi");
          refreshPresence();
        })
        .on(RoomEvent.ParticipantDisconnected, (p) => {
          logEvent(`participant left: ${p.identity}`);
          refreshPresence();
        })
        .on(RoomEvent.TrackSubscribed, (track, _pub, p) => {
          if (track.kind === "audio") {
            logEvent(`subscribed to audio from ${p.identity}`);
            const el = track.attach();
            el.setAttribute("autoplay", "");
            el.setAttribute("playsinline", "");
          }
        })
        .on(RoomEvent.ActiveSpeakersChanged, () => refreshPresence())
        .on(RoomEvent.TranscriptionReceived, (segments, participant) => {
          // Fallback path: only fires if a segment-publishing agent joins
          // the room. The Pipecat bot sends transcripts as data messages
          // (see DataReceived below), so this normally stays quiet.
          const isAgent = !!participant && participant.identity === BOT_IDENTITY;
          for (const seg of segments) {
            renderTranscript(isAgent ? "agent" : "user", seg.text || "", !!seg.isFinal);
          }
        })
        .on(RoomEvent.DataReceived, (payload, participant) => {
          // Primary path: bot.py's TranscriptTap publishes
          // {type:"transcript", speaker, text, final} as reliable data.
          // send_data carries no topic, so sender identity + JSON shape
          // ARE the routing — ignore everything else in the room.
          if (!participant || participant.identity !== BOT_IDENTITY) return;
          let msg;
          try {
            msg = JSON.parse(new TextDecoder().decode(payload));
          } catch {
            return;
          }
          if (!msg || msg.type !== "transcript") return;
          renderTranscript(msg.speaker === "agent" ? "agent" : "user", msg.text || "", !!msg.final);
        })
        .on(RoomEvent.Disconnected, () => {
          connected = false;
          setState("idle", "");
          els.talk.disabled = true;
          els.talk.dataset.on = "false";
          els.talk.textContent = "Talk (mic off)";
          els.connect.textContent = "Connect";
          els.connect.disabled = false;
          els.room.disabled = false;
          logEvent("disconnected");
        });

      async function connect() {
        const roomName = els.room.value.trim() || "lobby";
        els.connect.disabled = true;
        els.room.disabled = true;
        els.connect.textContent = "Connecting...";
        setState("connecting");
        logEvent(`requesting token for room "${roomName}"`);
        try {
          const res = await fetch(`/get_token?room=${encodeURIComponent(roomName)}`);
          if (!res.ok) throw new Error(`token server returned ${res.status}`);
          const { url, token } = await res.json();
          await room.connect(url, token);
          await room.startAudio();
          await room.localParticipant.setMicrophoneEnabled(true);
          connected = true;
          els.talk.disabled = false;
          els.talk.dataset.on = "true";
          els.talk.textContent = "Talk (mic on)";
          els.connect.textContent = "Disconnect";
          logEvent(`joined "${roomName}" as ${room.localParticipant.identity}`);
          refreshPresence();
        } catch (err) {
          console.error(err);
          logEvent(`ERROR: ${err.message}`);
          setState("failed", "check token_server.py and the room name");
          els.connect.disabled = false;
          els.room.disabled = false;
          els.connect.textContent = "Connect";
        }
      }

      async function disconnect() {
        await room.disconnect();
      }

      els.connect.addEventListener("click", () => {
        if (connected) disconnect();
        else connect();
      });

      els.talk.addEventListener("click", async () => {
        const enable = els.talk.dataset.on !== "true";
        try {
          await room.localParticipant.setMicrophoneEnabled(enable);
        } catch (err) {
          console.error("mic error", err);
        }
        const micTrack = room.localParticipant.getTrackPublication("microphone");
        const on = enable && micTrack && micTrack.isEnabled;
        els.talk.dataset.on = on ? "true" : "false";
        els.talk.textContent = on ? "Talk (mic on)" : "Talk (mic off)";
        logEvent(on ? "mic on" : "mic muted");
      });
    </script>
  </body>
</html>
