<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realtime Voice AI Agent</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #181b24;
        --border: #262b38;
        --text: #e6e8ee;
        --muted: #9aa1b2;
        --accent: #5472e8;
        --idle: #6b7280;
        --listening: #34d399;
        --thinking: #fbbf24;
        --speaking: #60a5fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(
          1200px 600px at 50% -100px,
          #1c2230 0%,
          var(--bg) 60%
        );
        color: var(--text);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 20px;
      }

      .indicator-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      .indicator {
        --indicator-active: var(--idle);
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--indicator-active);
        position: relative;
        flex: 0 0 auto;
        transition:
          background 0.25s ease,
          opacity 0.4s ease,
          transform 0.4s ease,
          box-shadow 0.25s ease;
        box-shadow: 0 0 22px 3px color-mix(in srgb, var(--indicator-active) 40%, transparent);
      }
      /* no gray circle before the session is live */
      .indicator[data-state="idle"] {
        opacity: 0;
        transform: scale(0.8);
        pointer-events: none;
      }
      .indicator[data-state="listening"] {
        --indicator-active: var(--listening);
      }
      .indicator[data-state="thinking"] {
        --indicator-active: var(--thinking);
      }
      .indicator[data-state="speaking"] {
        --indicator-active: var(--speaking);
      }
      .indicator[data-state="connecting"],
      .indicator[data-state="initializing"] {
        --indicator-active: var(--accent);
      }
      .indicator::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--indicator-active);
        opacity: 0;
      }
      .indicator[data-state="listening"]::after,
      .indicator[data-state="thinking"]::after,
      .indicator[data-state="speaking"]::after {
        animation: pulse 1.4s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.55;
        }
        70% {
          transform: scale(1.9);
          opacity: 0;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      .status {
        font-size: 15px;
        font-weight: 600;
      }
      .subagent {
        color: var(--muted);
        font-size: 12px;
        min-height: 16px;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #232838;
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.05s;
      }
      button:hover:not(:disabled) {
        background: #2c3347;
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #connectBtn {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      #connectBtn:hover:not(:disabled) {
        background: #6884f0;
      }
      #talkBtn[data-on="true"] {
        background: var(--listening);
        border-color: var(--listening);
        color: #06281c;
      }

      .transcript {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #12141c;
        height: 260px;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 14px;
        line-height: 1.45;
        max-width: 88%;
      }
      .msg.user {
        align-self: flex-end;
        background: #2b3350;
      }
      .msg.agent {
        align-self: flex-start;
        background: #26313a;
      }
      .msg .who {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .transcript:empty::before {
        content: "Transcript will appear here while you talk.";
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Voice AI Agent</h1>
      <p class="subtitle">
        Browser WebRTC - LiveKit transport, Deepgram STT, Groq LLM, Cartesia TTS
      </p>

      <div class="indicator-wrap">
        <div id="indicator" class="indicator" data-state="idle"></div>
        <div>
          <div id="status" class="status">Idle</div>
          <div id="agentName" class="subagent"></div>
        </div>
      </div>

      <div class="controls">
        <button id="connectBtn" type="button">Connect</button>
        <button id="talkBtn" type="button" disabled data-on="false">
          Talk (mic off)
        </button>
      </div>

      <div id="transcript" class="transcript"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
    <script>
      // livekit-client only ships the UMD (window.LivekitClient) build for the
      // `@2` release line on every CDN — the `.es.mjs` variant 404s, which is
      // why nothing happened on Connect before.
      const { Room, RoomEvent } = window.LivekitClient;

      const $id = (s) => document.getElementById(s);
      const els = {
        connect: $id("connectBtn"),
        talk: $id("talkBtn"),
        indicator: $id("indicator"),
        status: $id("status"),
        agentName: $id("agentName"),
        transcript: $id("transcript"),
      };

      const room = new Room({ adaptiveStream: true, dynacast: true });
      let agentState = "idle";
      let controlSocket = null;

      async function connectControlSocket(roomName) {
        const gatewayResponse = await fetch(
          `/get_gateway_token?room=${encodeURIComponent(roomName)}`,
        );

        if (!gatewayResponse.ok) {
          throw new Error("failed to get gateway token");
        }

        const { gateway_token } = await gatewayResponse.json();

        const gatewayHost = window.location.hostname || "127.0.0.1";
        controlSocket = new WebSocket(`ws://${gatewayHost}:8081/ws`);

        controlSocket.addEventListener("open", () => {
          controlSocket.send(
            JSON.stringify({
              type: "session.start",
              room: roomName,
              token: gateway_token,
            }),
          );
        });

        controlSocket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data);

          if (message.type === "session.ready") {
            els.agentName.textContent = "Gateway connected";
          } else if (message.type === "session.accepted") {
            els.agentName.textContent = `Control session ready: ${message.room}`;
          } else if (message.type === "error") {
            els.agentName.textContent = `Gateway error: ${message.message}`;
          }

          console.log("gateway event", message);
        });

        controlSocket.addEventListener("error", (event) => {
          console.warn("gateway control connection failed", event);
        });
      }
      const STATE_TEXT = {
        connecting: "Connecting...",
        initializing: "Agent initializing...",
        idle: "Agent idle",
        listening: "Listening - your turn",
        thinking: "Thinking...",
        speaking: "Speaking",
        disconnected: "Disconnected",
        failed: "Failed",
      };

      function setAgentState(state) {
        state = state || "idle";
        if (state === agentState) return;
        agentState = state;
        els.indicator.dataset.state = state;
        els.status.textContent = STATE_TEXT[state] || state;
      }

      // LiveKit Agents publishes its state as the `lk.agent.state` participant attribute.
      function readAgentState(p) {
        if (p && p.isAgent && p.attributes) {
          const s = p.attributes["lk.agent.state"];
          if (s) {
            setAgentState(s);
            return true;
          }
        }
        return false;
      }

      function addRow(speaker) {
        const div = document.createElement("div");
        div.className = `msg ${speaker}`;
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = speaker === "agent" ? "Agent" : "You";
        div.appendChild(who);
        els.transcript.appendChild(div);
        return div;
      }

      function setText(row, text) {
        const existing = row.querySelector(".text");
        if (existing) existing.textContent = text;
        else {
          const span = document.createElement("span");
          span.className = "text";
          span.textContent = text;
          row.appendChild(span);
        }
      }

      let currentAgentRow = null;
      let currentUserRow = null;
      let agentRowSegId = null;
      let userRowSegId = null;
      // LiveKit re-emits each segment with the full text so far; appending the
      // whole string each event is what produced those duplicated words. We
      // diff against the last emission for that segment id and append only the
      // newly-transcribed portion. A new segment id (or a final flag) means the
      // agent finished its sentence, so the next text starts a fresh bubble.
      const segCache = new Map();

      function scrollBottom() {
        els.transcript.scrollTop = els.transcript.scrollHeight;
      }

      function handleTranscription(segments, participant) {
        const isAgent = !!(participant && participant.isAgent);
        for (const [i, seg] of segments.entries()) {
          const text = seg.text || "";
          const id =
            seg.id != null ? seg.id : seg.segmentId ?? `${participant && participant.identity || "?"}:${i}`;
          const prev = segCache.get(id) || "";
          let delta = text;
          if (text.length >= prev.length && text.startsWith(prev)) {
            delta = text.slice(prev.length);
          }
          segCache.set(id, text);

          if (isAgent) {
            // end of the current utterance: never leave a stale bubble open
            if (seg.isFinal) {
              currentAgentRow = null;
              segCache.delete(id);
              if (!delta) continue;
            } else if (currentAgentRow && id !== agentRowSegId) {
              currentAgentRow = null;
            }
            if (!delta) continue;
            if (!currentAgentRow) {
              currentAgentRow = addRow("agent");
              agentRowSegId = id;
            }
            setText(
              currentAgentRow,
              (currentAgentRow.querySelector(".text")?.textContent || "") + delta,
            );
          } else {
            if (seg.isFinal) {
              currentAgentRow = null;
              currentUserRow = null;
              setText(addRow("user"), text);
              segCache.delete(id);
            } else {
              if (currentUserRow && id !== userRowSegId) currentUserRow = null;
              if (!delta) continue;
              if (!currentUserRow) {
                currentUserRow = addRow("user");
                userRowSegId = id;
              }
              setText(currentUserRow, (currentUserRow.querySelector(".text")?.textContent || "") + delta);
            }
          }
        }
        scrollBottom();
      }

      room
        .on(RoomEvent.ParticipantConnected, (p) => {
          if (p.isAgent) {
            els.agentName.textContent = `${p.name || p.identity} joined`;
            if (!readAgentState(p)) setAgentState("listening");
          }
        })
        .on(RoomEvent.ParticipantAttributesChanged, (changed, p) => {
          if (p.isAgent && "lk.agent.state" in changed) readAgentState(p);
        })
        .on(RoomEvent.TranscriptionReceived, handleTranscription)
        .on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") {
            const el = track.attach();
            el.setAttribute("autoplay", "");
            el.setAttribute("playsinline", "");
          }
        })
        .on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
          // audio-based fallback only while attribute-driven state is idle/listening/thinking
          const agentSpeaking = speakers.some((p) => p.isAgent);
          if (
            agentSpeaking &&
            ["idle", "listening", "thinking", "connecting"].includes(agentState)
          ) {
            setAgentState("speaking");
          }
        })
        .on(RoomEvent.Disconnected, () => {
          if (controlSocket) {
            controlSocket.close();
            controlSocket = null;
          }
          setAgentState("idle");
          els.agentName.textContent = "";
          els.talk.disabled = true;
          els.talk.dataset.on = "false";
          els.talk.textContent = "Talk (mic off)";
          els.connect.textContent = "Connect";
          els.connect.disabled = false;
          currentAgentRow = currentUserRow = null;
          els.transcript.innerHTML = "";
        });

      async function connect() {
        els.connect.disabled = true;
        els.connect.textContent = "Connecting...";
        setAgentState("connecting");
        try {
          const res = await fetch("/get_token?room=lobby");
          if (!res.ok) throw new Error(`token server returned ${res.status}`);
          const { url, token } = await res.json();
          await room.connect(url, token);
          setAgentState("initializing");
          await connectControlSocket("lobby");
          await room.startAudio();
          await room.localParticipant.setMicrophoneEnabled(true);
          els.talk.disabled = false;
          els.talk.dataset.on = "true";
          els.talk.textContent = "Talk (mic on)";
          els.connect.textContent = "Connected";
        } catch (err) {
          console.error(err);
          setAgentState("failed");
          els.status.textContent =
            "Connection failed - check agent worker and token server";
          els.connect.disabled = false;
          els.connect.textContent = "Connect";
        }
      }

      els.connect.addEventListener("click", connect);

      els.talk.addEventListener("click", async () => {
        const enable = els.talk.dataset.on !== "true";
        try {
          await room.localParticipant.setMicrophoneEnabled(enable);
        } catch (err) {
          console.error("mic error", err);
        }
        const micTrack =
          room.localParticipant.getTrackPublication("microphone");
        const on = enable && micTrack && micTrack.isEnabled;
        els.talk.dataset.on = on ? "true" : "false";
        els.talk.textContent = on ? "Talk (mic on)" : "Talk (mic off)";
      });
    </script>
  </body>
</html>
