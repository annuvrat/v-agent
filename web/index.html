<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realtime Voice AI Agent</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #181b24;
      --border: #262b38;
      --text: #e6e8ee;
      --muted: #9aa1b2;
      --accent: #5472e8;
      --idle: #6b7280;
      --listening: #34d399;
      --thinking: #fbbf24;
      --speaking: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -100px, #1c2230 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    .indicator-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .indicator {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--idle);
      position: relative; flex: 0 0 auto;
      transition: background 0.25s ease;
    }
    .indicator::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid currentColor; opacity: 0.5;
    }
    .indicator[data-state="listening"] { background: var(--listening); color: var(--listening); }
    .indicator[data-state="thinking"]  { background: var(--thinking);  color: var(--thinking); }
    .indicator[data-state="speaking"]  { background: var(--speaking);  color: var(--speaking); }
    .indicator[data-state="listening"]::after,
    .indicator[data-state="thinking"]::after,
    .indicator[data-state="speaking"]::after {
      animation: pulse 1.4s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.55; }
      70%  { transform: scale(1.9); opacity: 0; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    .status { font-size: 15px; font-weight: 600; }
    .subagent { color: var(--muted); font-size: 12px; min-height: 16px; }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    button {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: #232838; color: var(--text); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s, transform 0.05s;
    }
    button:hover:not(:disabled) { background: #2c3347; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #connectBtn { background: var(--accent); border-color: var(--accent); color: #fff; }
    #connectBtn:hover:not(:disabled) { background: #6884f0; }
    #talkBtn[data-on="true"] { background: var(--listening); border-color: var(--listening); color: #06281c; }

    .transcript {
      border: 1px solid var(--border); border-radius: 12px; background: #12141c;
      height: 260px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .msg { border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.45; max-width: 88%; }
    .msg.user  { align-self: flex-end; background: #2b3350; }
    .msg.agent { align-self: flex-start; background: #26313a; }
    .msg .who { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 2px; }
    .transcript:empty::before {
      content: "Transcript will appear here while you talk."; color: var(--muted); font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Voice AI Agent</h1>
    <p class="subtitle">Browser WebRTC - LiveKit transport, Deepgram STT, Groq LLM, Cartesia TTS</p>

    <div class="indicator-wrap">
      <div id="indicator" class="indicator" data-state="idle"></div>
      <div>
        <div id="status" class="status">Idle</div>
        <div id="agentName" class="subagent"></div>
      </div>
    </div>

    <div class="controls">
      <button id="connectBtn" type="button">Connect</button>
      <button id="talkBtn" type="button" disabled data-on="false">Talk (mic off)</button>
    </div>

    <div id="transcript" class="transcript"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
  <script>
    // livekit-client only ships the UMD (window.LivekitClient) build for the
    // `@2` release line on every CDN — the `.es.mjs` variant 404s, which is
    // why nothing happened on Connect before.
    const { Room, RoomEvent } = window.LivekitClient;

    const $id = (s) => document.getElementById(s);
    const els = {
      connect: $id("connectBtn"),
      talk: $id("talkBtn"),
      indicator: $id("indicator"),
      status: $id("status"),
      agentName: $id("agentName"),
      transcript: $id("transcript"),
    };

    const room = new Room({ adaptiveStream: true, dynacast: true });
    let agentState = "idle";

    const STATE_TEXT = {
      connecting: "Connecting...",
      initializing: "Agent initializing...",
      idle: "Agent idle",
      listening: "Listening - your turn",
      thinking: "Thinking...",
      speaking: "Speaking",
      disconnected: "Disconnected",
      failed: "Failed",
    };

    function setAgentState(state) {
      state = state || "idle";
      if (state === agentState) return;
      agentState = state;
      els.indicator.dataset.state = state;
      els.status.textContent = STATE_TEXT[state] || state;
    }

    // LiveKit Agents publishes its state as the `lk.agent.state` participant attribute.
    function readAgentState(p) {
      if (p && p.isAgent && p.attributes) {
        const s = p.attributes["lk.agent.state"];
        if (s) { setAgentState(s); return true; }
      }
      return false;
    }

    function addRow(speaker) {
      const div = document.createElement("div");
      div.className = `msg ${speaker}`;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = speaker === "agent" ? "Agent" : "You";
      div.appendChild(who);
      els.transcript.appendChild(div);
      return div;
    }

    function setText(row, text) {
      const existing = row.querySelector(".text");
      if (existing) existing.textContent = text;
      else {
        const span = document.createElement("span");
        span.className = "text";
        span.textContent = text;
        row.appendChild(span);
      }
    }

    let currentAgentRow = null;
    let currentUserRow = null;

    function scrollBottom() {
      els.transcript.scrollTop = els.transcript.scrollHeight;
    }

    function handleTranscription(segments, participant) {
      const isAgent = !!(participant && participant.isAgent);
      for (const seg of segments) {
        if (isAgent) {
          // agent transcripts arrive as delta chunks; append to a single bubble per turn
          if (!currentAgentRow) currentAgentRow = addRow("agent");
          setText(currentAgentRow, (currentAgentRow.querySelector(".text")?.textContent || "") + seg.text);
          if (seg.isFinal) currentAgentRow = null;
        } else {
          if (seg.isFinal) {
            currentAgentRow = null;
            currentUserRow = null;
            setText(addRow("user"), seg.text);
          } else {
            if (!currentUserRow) currentUserRow = addRow("user");
            setText(currentUserRow, seg.text);
          }
        }
      }
      scrollBottom();
    }

    room
      .on(RoomEvent.ParticipantConnected, (p) => {
        if (p.isAgent) {
          els.agentName.textContent = `${p.name || p.identity} joined`;
          if (!readAgentState(p)) setAgentState("listening");
        }
      })
      .on(RoomEvent.ParticipantAttributesChanged, (changed, p) => {
        if (p.isAgent && "lk.agent.state" in changed) readAgentState(p);
      })
      .on(RoomEvent.TranscriptionReceived, handleTranscription)
      .on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === "audio") {
          const el = track.attach();
          el.setAttribute("autoplay", "");
          el.setAttribute("playsinline", "");
        }
      })
      .on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
        // audio-based fallback only while attribute-driven state is idle/listening/thinking
        const agentSpeaking = speakers.some((p) => p.isAgent);
        if (agentSpeaking && ["idle", "listening", "thinking", "connecting"].includes(agentState)) {
          setAgentState("speaking");
        }
      })
      .on(RoomEvent.Disconnected, () => {
        setAgentState("idle");
        els.agentName.textContent = "";
        els.talk.disabled = true;
        els.talk.dataset.on = "false";
        els.talk.textContent = "Talk (mic off)";
        els.connect.textContent = "Connect";
        els.connect.disabled = false;
        currentAgentRow = currentUserRow = null;
        els.transcript.innerHTML = "";
      });

    async function connect() {
      els.connect.disabled = true;
      els.connect.textContent = "Connecting...";
      setAgentState("connecting");
      try {
        const res = await fetch("/get_token?room=lobby");
        if (!res.ok) throw new Error(`token server returned ${res.status}`);
        const { url, token } = await res.json();
        await room.connect(url, token);
        await room.startAudio();
        await room.localParticipant.setMicrophoneEnabled(true);
        els.talk.disabled = false;
        els.talk.dataset.on = "true";
        els.talk.textContent = "Talk (mic on)";
        els.connect.textContent = "Connected";
      } catch (err) {
        console.error(err);
        els.status.textContent = "Connection failed - check agent worker and token server";
        els.connect.disabled = false;
        els.connect.textContent = "Connect";
      }
    }

    els.connect.addEventListener("click", connect);

    els.talk.addEventListener("click", async () => {
      const enable = els.talk.dataset.on !== "true";
      try {
        await room.localParticipant.setMicrophoneEnabled(enable);
      } catch (err) {
        console.error("mic error", err);
      }
      const micTrack = room.localParticipant.getTrackPublication("microphone");
      const on = enable && micTrack && micTrack.isEnabled;
      els.talk.dataset.on = on ? "true" : "false";
      els.talk.textContent = on ? "Talk (mic on)" : "Talk (mic off)";
    });
  </script>
</body>
</html>
