<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mia · Teacher Board</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #181b24;
        --border: #262b38;
        --text: #e6e8ee;
        --muted: #9aa1b2;
        --accent: #34d399;
        --idle: #6b7280;
        --listening: #34d399;
        --thinking: #fbbf24;
        --speaking: #60a5fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 50% -100px, #14231d 0%, var(--bg) 60%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 720px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

      #board {
        width: 100%;
        height: 380px;
        display: block;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #101319;
        cursor: default;
      }
      .caption {
        color: var(--muted);
        font-size: 13px;
        min-height: 18px;
        margin: 8px 2px 16px;
      }

      .indicator-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
      .indicator {
        width: 52px; height: 52px; border-radius: 50%;
        background: var(--idle);
        position: relative; flex: 0 0 auto;
        transition: background 0.25s ease, box-shadow 0.25s ease;
        box-shadow: 0 0 18px 3px rgba(107, 114, 128, 0.4);
      }
      .indicator[data-state="listening"] { background: var(--listening); box-shadow: 0 0 18px 3px rgba(52, 211, 153, 0.4); }
      .indicator[data-state="thinking"] { background: var(--thinking); box-shadow: 0 0 18px 3px rgba(251, 191, 36, 0.4); }
      .indicator[data-state="speaking"] { background: var(--speaking); box-shadow: 0 0 18px 3px rgba(96, 165, 250, 0.45); }
      .indicator[data-state="connecting"],
      .indicator[data-state="initializing"] { background: var(--accent); }
      .indicator[data-state="listening"]::after,
      .indicator[data-state="thinking"]::after,
      .indicator[data-state="speaking"]::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        border: 2px solid currentColor; opacity: 0;
        animation: pulse 1.4s ease-out infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.55; }
        70% { transform: scale(1.9); opacity: 0; }
        100% { transform: scale(1.9); opacity: 0; }
      }
      .status { font-size: 15px; font-weight: 600; }
      .subagent { color: var(--muted); font-size: 12px; min-height: 16px; }

      .controls { display: flex; gap: 10px; margin-bottom: 20px; }
      button {
        flex: 1; padding: 12px 14px; border-radius: 10px;
        border: 1px solid var(--border); background: #232838;
        color: var(--text); font-size: 14px; font-weight: 600;
        cursor: pointer; transition: background 0.15s, transform 0.05s;
      }
      button:hover:not(:disabled) { background: #2c3347; }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #connectBtn { background: var(--accent); border-color: var(--accent); color: #06281c; }
      #connectBtn:hover:not(:disabled) { background: #4be0a8; }
      #talkBtn[data-on="true"] { background: var(--listening); border-color: var(--listening); color: #06281c; }

      .transcript {
        border: 1px solid var(--border); border-radius: 12px; background: #12141c;
        height: 180px; overflow-y: auto; padding: 14px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .msg { border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.45; max-width: 88%; }
      .msg.user { align-self: flex-end; background: #2b3350; }
      .msg.agent { align-self: flex-start; background: #26313a; }
      .msg .who { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 2px; }
      .transcript:empty::before { content: "Mia's explanations appear here while she draws."; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Mia · Teacher Board</h1>
      <p class="subtitle">
        Ask her to explain something visual — she draws on this canvas while she talks.
      </p>

      <canvas id="board"></canvas>
      <div id="caption" class="caption">Board is empty — ask Mia to explain something visual.</div>

      <div class="indicator-wrap">
        <div id="indicator" class="indicator" data-state="idle"></div>
        <div>
          <div id="status" class="status">Idle</div>
          <div id="agentName" class="subagent"></div>
        </div>
      </div>

      <div class="controls">
        <button id="connectBtn" type="button">Connect</button>
        <button id="talkBtn" type="button" disabled data-on="false">Talk (mic off)</button>
      </div>

      <div id="transcript" class="transcript"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
    <script>
      const { Room, RoomEvent } = window.LivekitClient;

      const $id = (s) => document.getElementById(s);
      const els = {
        connect: $id("connectBtn"),
        talk: $id("talkBtn"),
        indicator: $id("indicator"),
        status: $id("status"),
        agentName: $id("agentName"),
        transcript: $id("transcript"),
        board: $id("board"),
        caption: $id("caption"),
      };

      // ---------- whiteboard renderer ----------
      // Mia draws in a normalized 1000x1000 space (origin top-left); the ops
      // below scale to whatever size this canvas is. All ops are kept so a
      // resize simply redraws everything.
      const bctx = els.board.getContext("2d");
      let ops = [];
      let animating = false;
      const NAMED = new Set(["white","black","red","green","blue","yellow","orange","purple","pink","cyan","teal","gray","grey"]);
      const FALLBACK_COLOR = "#e6e8ee";

      const num = (v, dflt) => (typeof v === "number" && isFinite(v) ? v : dflt);
      const col = (c) => {
        const t = typeof c === "string" ? c.trim() : "";
        if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(t) || NAMED.has(t.toLowerCase())) return t;
        return FALLBACK_COLOR;
      };
      const caption = (t) => { els.caption.textContent = t; };

      function sizeBoard() {
        const dpr = window.devicePixelRatio || 1;
        const rect = els.board.getBoundingClientRect();
        els.board.width = Math.max(1, Math.round(rect.width * dpr));
        els.board.height = Math.max(1, Math.round(rect.height * dpr));
        redraw();
      }
      window.addEventListener("resize", sizeBoard);

      function drawArrow(x1, y1, x2, y2) {
        bctx.beginPath();
        bctx.moveTo(x1, y1);
        bctx.lineTo(x2, y2);
        bctx.stroke();
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const head = Math.max(10, bctx.lineWidth * 3);
        bctx.beginPath();
        bctx.moveTo(x2, y2);
        bctx.lineTo(x2 - head * Math.cos(ang - Math.PI / 7), y2 - head * Math.sin(ang - Math.PI / 7));
        bctx.moveTo(x2, y2);
        bctx.lineTo(x2 - head * Math.cos(ang + Math.PI / 7), y2 - head * Math.sin(ang + Math.PI / 7));
        bctx.stroke();
      }

      function redraw(now) {
        const dpr = window.devicePixelRatio || 1;
        const w = els.board.clientWidth;
        const h = els.board.clientHeight;
        const X = (x) => (x / 1000) * w;
        const Y = (y) => (y / 1000) * h;
        const W = (s) => Math.max(1, (s / 1000) * w); // line widths scale with width
        bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        bctx.clearRect(0, 0, w, h);
        bctx.lineCap = "round";
        bctx.lineJoin = "round";
        let needAnotherFrame = false;
        for (const op of ops) {
          bctx.strokeStyle = op.color;
          bctx.fillStyle = op.color;
          bctx.lineWidth = op.width != null ? W(op.width) : W(5);
          switch (op.kind) {
            case "line":
              bctx.beginPath(); bctx.moveTo(X(op.x1), Y(op.y1)); bctx.lineTo(X(op.x2), Y(op.y2)); bctx.stroke();
              break;
            case "arrow":
              drawArrow(X(op.x1), Y(op.y1), X(op.x2), Y(op.y2));
              break;
            case "rect":
              bctx.strokeRect(X(op.x), Y(op.y), (op.w / 1000) * w, (op.h / 1000) * h);
              break;
            case "circle":
              bctx.beginPath(); bctx.arc(X(op.x), Y(op.y), (op.r / 1000) * w, 0, Math.PI * 2); bctx.stroke();
              break;
            case "stroke":
              bctx.beginPath();
              op.points.forEach(([px, py], i) => {
                if (i === 0) bctx.moveTo(X(px), Y(py));
                else bctx.lineTo(X(px), Y(py));
              });
              bctx.stroke();
              break;
            case "text":
              bctx.font = `${Math.max(10, (op.size / 1000) * w)}px "Segoe UI", system-ui, sans-serif`;
              bctx.textBaseline = "top";
              bctx.fillText(op.text, X(op.x), Y(op.y));
              break;
            case "highlight": {
              const age = (now || performance.now()) - op.at;
              if (age < 1500) {
                needAnotherFrame = true;
                const t = age / 1500;
                bctx.globalAlpha = 1 - t;
                bctx.lineWidth = W(6);
                bctx.beginPath();
                bctx.arc(X(op.x), Y(op.y), 12 + t * 44, 0, Math.PI * 2);
                bctx.stroke();
                bctx.globalAlpha = 1;
              }
              break;
            }
          }
        }
        if (needAnotherFrame && !animating) {
          animating = true;
          requestAnimationFrame(function tick(t) {
            const fresh = ops.some((op) => op.kind === "highlight" && t - op.at < 1500);
            redraw(t);
            if (fresh) requestAnimationFrame(tick);
            else animating = false;
          });
        }
      }

      function applyOp(op) {
        if (!op || typeof op.type !== "string") return;
        if (op.type === "wb.clear") {
          ops = [];
          caption("Board cleared.");
          redraw();
          return;
        }
        const color = col(op.color);
        const width = Math.max(1, Math.min(20, Math.round(num(op.width, 5))));
        const cx = (v) => Math.max(0, Math.min(1000, Math.round(num(v, 0))));
        switch (op.type) {
          case "wb.text": {
            const text = String(op.text || "").slice(0, 120);
            if (!text) return;
            ops.push({ kind: "text", x: cx(op.x), y: cx(op.y), text, size: Math.max(12, Math.min(80, Math.round(num(op.size, 30)))), color });
            caption(`Mia wrote: “${text}”`);
            break;
          }
          case "wb.line":
          case "wb.arrow":
            ops.push({ kind: op.type === "wb.arrow" ? "arrow" : "line", x1: cx(op.x1), y1: cx(op.y1), x2: cx(op.x2), y2: cx(op.y2), color, width });
            caption(op.type === "wb.arrow" ? "Mia drew an arrow." : "Mia drew a line.");
            break;
          case "wb.rect":
            ops.push({ kind: "rect", x: cx(op.x), y: cx(op.y), w: Math.max(10, Math.min(1000, Math.round(num(op.w, 100)))), h: Math.max(10, Math.min(1000, Math.round(num(op.h, 100)))), color, width });
            caption("Mia drew a box.");
            break;
          case "wb.circle":
            ops.push({ kind: "circle", x: cx(op.x), y: cx(op.y), r: Math.max(10, Math.min(500, Math.round(num(op.r, 60)))), color, width });
            caption("Mia drew a circle.");
            break;
          case "wb.stroke": {
            const raw = Array.isArray(op.points) ? op.points.filter((v) => typeof v === "number" && isFinite(v)) : [];
            if (raw.length < 4) return;
            const pts = [];
            for (let i = 0; i + 1 < raw.length && pts.length < 60; i += 2) {
              pts.push([cx(raw[i]), cx(raw[i + 1])]);
            }
            if (pts.length < 2) return;
            ops.push({ kind: "stroke", points: pts, color, width });
            caption("Mia sketched a stroke.");
            break;
          }
          case "wb.highlight":
            ops.push({ kind: "highlight", x: cx(op.x), y: cx(op.y), color, at: performance.now() });
            caption("Mia pointed at part of the board.");
            break;
          default:
            return;
        }
        redraw();
      }

      // ---------- voice session (same agent, same room) ----------
      const room = new Room({ adaptiveStream: true, dynacast: true });
      let agentState = "idle";

      const STATE_TEXT = {
        connecting: "Connecting...",
        initializing: "Agent initializing...",
        idle: "Agent idle",
        listening: "Listening — your turn",
        thinking: "Thinking...",
        speaking: "Speaking",
        disconnected: "Disconnected",
        failed: "Failed",
      };

      function setAgentState(state) {
        state = state || "idle";
        if (state === agentState) return;
        agentState = state;
        els.indicator.dataset.state = state;
        els.status.textContent = STATE_TEXT[state] || state;
      }

      function readAgentState(p) {
        if (p && p.isAgent && p.attributes) {
          const s = p.attributes["lk.agent.state"];
          if (s) {
            setAgentState(s);
            return true;
          }
        }
        return false;
      }

      function addRow(speaker, text) {
        const div = document.createElement("div");
        div.className = `msg ${speaker}`;
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = speaker === "agent" ? "Mia" : "You";
        div.appendChild(who);
        const span = document.createElement("span");
        span.className = "text";
        span.textContent = text;
        div.appendChild(span);
        els.transcript.appendChild(div);
        els.transcript.scrollTop = els.transcript.scrollHeight;
        return div;
      }

      let currentRow = null;
      let currentSpeaker = null;

      room
        .on(RoomEvent.ParticipantConnected, (p) => {
          if (p.isAgent) {
            els.agentName.textContent = `${p.name || p.identity} joined`;
            if (!readAgentState(p)) setAgentState("listening");
          }
        })
        .on(RoomEvent.ParticipantAttributesChanged, (changed, p) => {
          if (p.isAgent && "lk.agent.state" in changed) readAgentState(p);
        })
        .on(RoomEvent.TranscriptionReceived, (segments, participant) => {
          const isAgent = !!(participant && participant.isAgent);
          const speaker = isAgent ? "agent" : "user";
          for (const seg of segments) {
            const text = seg.text || "";
            if (!text) continue;
            if (currentSpeaker !== speaker) {
              currentRow = addRow(speaker, text);
              currentSpeaker = speaker;
            } else if (currentRow) {
              currentRow.querySelector(".text").textContent = text;
            }
            if (seg.isFinal) {
              currentRow = null;
              currentSpeaker = null;
            }
          }
        })
        .on(RoomEvent.DataReceived, (payload, participant, kind, topic) => {
          // Whiteboard ops from Mia. We publish on topic "whiteboard"; the
          // message-shape check is a second gate in case a relay ever drops
          // the topic.
          let msg;
          try {
            msg = JSON.parse(new TextDecoder().decode(payload));
          } catch {
            return;
          }
          if (!msg || typeof msg.type !== "string" || !msg.type.startsWith("wb.")) return;
          if (topic !== "whiteboard" && topic) return;
          applyOp(msg);
        })
        .on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") {
            const el = track.attach();
            el.setAttribute("autoplay", "");
            el.setAttribute("playsinline", "");
          }
        })
        .on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
          const agentSpeaking = speakers.some((p) => p.isAgent);
          if (agentSpeaking && ["idle", "listening", "thinking", "connecting"].includes(agentState)) {
            setAgentState("speaking");
          }
        })
        .on(RoomEvent.Disconnected, () => {
          setAgentState("idle");
          els.agentName.textContent = "";
          els.talk.disabled = true;
          els.talk.dataset.on = "false";
          els.talk.textContent = "Talk (mic off)";
          els.connect.textContent = "Connect";
          els.connect.disabled = false;
          currentRow = currentSpeaker = null;
          els.transcript.innerHTML = "";
        });

      async function connect() {
        els.connect.disabled = true;
        els.connect.textContent = "Connecting...";
        setAgentState("connecting");
        try {
          const res = await fetch("/get_token?room=lobby");
          if (!res.ok) throw new Error(`token server returned ${res.status}`);
          const { url, token } = await res.json();
          await room.connect(url, token);
          setAgentState("initializing");
          await room.startAudio();
          await room.localParticipant.setMicrophoneEnabled(true);
          els.talk.disabled = false;
          els.talk.dataset.on = "true";
          els.talk.textContent = "Talk (mic on)";
          els.connect.textContent = "Connected";
        } catch (err) {
          console.error(err);
          setAgentState("failed");
          els.status.textContent = "Connection failed — check agent worker and token server";
          els.connect.disabled = false;
          els.connect.textContent = "Connect";
        }
      }

      els.connect.addEventListener("click", connect);

      els.talk.addEventListener("click", async () => {
        const enable = els.talk.dataset.on !== "true";
        try {
          await room.localParticipant.setMicrophoneEnabled(enable);
        } catch (err) {
          console.error("mic error", err);
        }
        const micTrack = room.localParticipant.getTrackPublication("microphone");
        const on = enable && micTrack && micTrack.isEnabled;
        els.talk.dataset.on = on ? "true" : "false";
        els.talk.textContent = on ? "Talk (mic on)" : "Talk (mic off)";
      });

      sizeBoard();
    </script>
  </body>
</html>
